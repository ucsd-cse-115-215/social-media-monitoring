[project]
name = "social-media-monitor"
version = "0.1.0"
description = "Multi-stage social media monitoring with LLM filtering — Poetry detector example"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "openai>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
monitor = "monitor.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
